<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Practice</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="js/script.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
    <h1>Need a hand with your next hike?</h1>
        <div class="hike-helper">
            <label for="hike-length">How long do you want your hike to be?</label>
            <!-- <input type="number" id="hike-length" min="1" value="1"> -->
            <input type="range" id="hike-length" min="1" max="3" value="2">
            <label for="hiking-difficulty">Preference?</label>
            <div class="buttons">
                <button id="easy">Easy Walk</button>
                <button id="moderate">Moderate Trek</button>
                <button id="challenging">Challenging Hike</button>
            </div>
            <div class="images">
                <img src="images/mtpinatubo.jpeg" id="easy-img" class="hike-img" style="display:none;">
                <img src="images/mtpulag.jpeg" id="moderate-img" class="hike-img" style="display:none;">
                <img src="images/mtdaraitan.jpeg" id="challenging-img" class="hike-img" style="display:none;">
            </div>
        </div>
</main>
</body>
</html>
